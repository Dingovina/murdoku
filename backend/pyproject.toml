[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murdoku"
version = "0.1.0"
description = "Murdoku — detective sudoku-like puzzle game (backend core + server)"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["murdoku", "murdoku.server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
